version: 2

jobs:
  go_build:
    docker:
      - image: cimg/go:1.26
      - image: cimg/redis:7.0
    steps:
      - checkout
      - restore_cache:
          keys:
            - go-mod-v1-{{ checksum "go.sum" }}
      - run:
          name: build
          command: go build ./...
      - run:
          name: vet
          command: go vet ./...
      - run:
          name: test
          command: go test ./...
      - save_cache:
          paths:
            - /home/circleci/go/pkg/mod
          key: go-mod-v1-{{ checksum "go.sum" }}

  go_docker_bot:
    docker:
      - image: docker:24-cli
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: build bot image
          command: docker build -f Dockerfile.bot -t kodiak-bot:$CIRCLE_SHA1 .

  go_docker_webapi:
    docker:
      - image: docker:24-cli
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: build webapi image
          command: docker build -f Dockerfile.webapi -t kodiak-webapi:$CIRCLE_SHA1 .

  docs_typecheck:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - docs-site-v2-{{ checksum "docs/yarn.lock" }}
      - run:
          name: install dependencies
          working_directory: docs
          command: yarn install --frozen-lockfile --non-interactive
      - save_cache:
          paths:
            - ./docs/node_modules
          key: docs-site-v2-{{ checksum "docs/yarn.lock" }}
      - run:
          name: typecheck
          working_directory: docs
          command: yarn typecheck

  docs_fmt:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - docs-site-v2-{{ checksum "docs/yarn.lock" }}
      - run:
          working_directory: docs
          command: yarn install --frozen-lockfile --non-interactive
      - run:
          working_directory: docs
          command: yarn fmt-ci

  docs_build:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - docs-site-v2-{{ checksum "docs/yarn.lock" }}
      - run:
          working_directory: docs
          command: yarn install --frozen-lockfile --non-interactive
      - run:
          working_directory: docs
          command: yarn build

  web_ui_lint:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - web-ui-v2-{{ checksum "web_ui/yarn.lock" }}
      - run:
          working_directory: web_ui
          command: yarn install --frozen-lockfile --non-interactive
      - save_cache:
          paths:
            - ./web_ui/node_modules
          key: web-ui-v2-{{ checksum "web_ui/yarn.lock" }}
      - run:
          working_directory: web_ui
          command: ./s/lint

  web_ui_test:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - restore_cache:
          keys:
            - web-ui-v2-{{ checksum "web_ui/yarn.lock" }}
      - run:
          working_directory: web_ui
          command: yarn install --frozen-lockfile --non-interactive
      - run:
          working_directory: web_ui
          command: ./s/test

  web_ui_build_container:
    docker:
      - image: docker:24-cli
    steps:
      - checkout
      - setup_remote_docker
      - run:
          working_directory: web_ui
          command: ./s/build

  shellcheck:
    docker:
      - image: ubuntu:22.04
    steps:
      - checkout
      - run:
          name: install shellcheck
          command: apt-get update && apt-get install -y git shellcheck
      - run:
          command: ./s/shellcheck

workflows:
  version: 2
  all:
    jobs:
      - shellcheck

  go:
    jobs:
      - go_build
      - go_docker_bot:
          requires:
            - go_build
      - go_docker_webapi:
          requires:
            - go_build

  docs:
    jobs:
      - docs_typecheck
      - docs_fmt
      - docs_build

  web_ui:
    jobs:
      - web_ui_lint
      - web_ui_test
      - web_ui_build_container
